# Publishes to npm and the official MCP Registry when a release tag like v0.1.0 is created,
# or when started by hand from the Actions tab ("Run workflow").
# npm: trusted publishing (OIDC) — no token stored anywhere. Configure it once on npmjs.com:
# package settings -> Trusted Publisher -> GitHub Actions, repo aslanklc04/agichainai-agent-tools, workflow publish.yml.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      - name: Check that the tools load
        run: node -e "import('./src/viem.js').then(m => { const t = m.createViemAgiTools({}); if (t.length !== 15) process.exit(1); console.log(t.length + ' tools') })"

      - name: Publish package to npm (skipped if this version is already there)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "agichainai-agent-tools@$V" version >/dev/null 2>&1; then
            echo "agichainai-agent-tools@$V is already on npm"
          else
            npm publish --access public
          fi
          for i in $(seq 1 30); do
            npm view "agichainai-agent-tools@$V" version >/dev/null 2>&1 && { echo "available on npm"; exit 0; }
            sleep 20
          done
          echo "npm has not made $V available yet"; exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
